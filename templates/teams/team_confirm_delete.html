{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow">
            <div class="card-body text-center">
                <h3>Видалити команду?</h3>
                <p class="lead">Ви впевнені, що хочете видалити команду <strong>"{{ object.name }}"</strong>?</p>
                <p class="text-danger small">Цю дію неможливо скасувати.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4">Так, видалити</button>
                    <a href="{% url 'index' %}" class="btn btn-secondary px-4">Скасувати</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
