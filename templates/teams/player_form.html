{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block title %}Додати гравця в {{ team.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Новий гравець: {{ team.name }}</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% bootstrap_form form %}
                    <div class="d-flex justify-content-between mt-3">
                        <a href="{% url 'player_list' team.id %}" class="btn btn-secondary">Назад до списку</a>
                        <button type="submit" class="btn btn-success">Зберегти гравця</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
