{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block title %}Створити команду{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header"><h3>Створити нову футбольну команду</h3></div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data"> {% csrf_token %}
                    {% bootstrap_form form %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'index' %}" class="btn btn-secondary">Скасувати</a>
                        <button type="submit" class="btn btn-success">Зберегти команду</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
