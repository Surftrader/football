{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow">
            <div class="card-body">
                <h2 class="card-title text-center">Вхід до системи</h2>
                <form method="post">
                    {% csrf_token %}
                    {% bootstrap_form form %}
                    <button type="submit" class="btn btn-primary w-100">Увійти</button>
                </form>
                <p class="mt-3 text-center">Немає аккаунта? <a href="{% url 'register' %}">Зареєструватися</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
